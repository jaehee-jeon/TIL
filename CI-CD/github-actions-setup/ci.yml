name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'  
      - run: pip install -r requirements.txt  # 1. 패키지 먼저
      - run: pip install pytest               # 2. pytest 설치
      - run: pytest test_hello.py -v          # 3. 테스트
      - run: python -m py_compile src/*.py    # 4. 문법 체크
